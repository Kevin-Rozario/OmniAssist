name: API image

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/kevin-rozario/omniassist-api:${{ github.sha }}
            ghcr.io/kevin-rozario/omniassist-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Kevin-Rozario/OmniAssist
            org.opencontainers.image.description=OmniAssist API
          cache-from: type=gha
          cache-to: type=gha,mode=max

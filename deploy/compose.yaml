name: omni

services:
  api:
    image: ghcr.io/kevin-rozario/omniassist-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./api.env
    mem_limit: 512m
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.omniassist.kevinrozario.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env before the first boot}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
